<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button class="cancel-btn" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="warn" class="confirm-btn" (click)="confirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
