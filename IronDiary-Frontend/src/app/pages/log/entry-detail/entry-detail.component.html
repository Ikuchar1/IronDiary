<app-entry-form
  *ngIf="!isLoading && isEditing"
  mode="edit"
  [entryId]="id"
  [kind]="kind"
  [type]="(workout?.type) || ''"
  [description]="(workout?.description) || ''"
  [note]="(rest?.note) || ''"
  [date]="editDate"
  (saved)="onSaved()"
  (cancelled)="isEditing = false"
></app-entry-form>

<!-- The Photo grid stays on screen in edit mode (ADR-0005: Photos are their own
     resource and commit live), so this block renders for both states and only the
     read-only entry fields are gated on !isEditing. -->
<div class="detail" *ngIf="!isLoading && (!isEditing || kind === 'workout')">

  <button mat-button class="back-btn" *ngIf="!isEditing" (click)="back()">← Back</button>

  <ng-container *ngIf="kind === 'workout' && workout as w">
    <ng-container *ngIf="!isEditing">
      <span class="entry-badge badge-workout">{{ w.type }}</span>
      <span class="entry-date">{{ w.date | date: 'EEEE, MMM d, y' : 'UTC' }}</span>
      <p class="entry-description" *ngIf="w.description">{{ w.description }}</p>
    </ng-container>

    <div class="photo-grid" *ngIf="w.photos.length">
      <div class="photo-tile" *ngFor="let photo of w.photos">
        <img [src]="photo.url" alt="Workout photo" />
        <button
          mat-mini-fab
          type="button"
          class="photo-remove-btn"
          *ngIf="isEditing"
          aria-label="Remove photo"
          (click)="removePhoto(photo)"
        >×</button>
      </div>
    </div>

    <div class="photos-empty" *ngIf="!w.photos.length">
      <span>Photos</span>
      <p>No photos on this workout yet.</p>
    </div>
  </ng-container>

  <ng-container *ngIf="kind === 'rest' && rest as r">
    <span class="entry-badge badge-rest">Rest</span>
    <span class="entry-date">{{ r.date | date: 'EEEE, MMM d, y' : 'UTC' }}</span>
    <p class="entry-note" *ngIf="r.note">{{ r.note }}</p>
  </ng-container>

  <div class="detail-actions" *ngIf="!isEditing">
    <button mat-stroked-button class="edit-btn" (click)="edit()">Edit</button>
    <button mat-stroked-button class="delete-btn" (click)="delete()">Delete</button>
  </div>

</div>
